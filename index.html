<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Muqawil Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen mobile app — sticky header, scrolling content, fixed bottom tab bar; bottom sheets. Brand: TECHNOTOUCH sage/olive greens from the company logo over aluminium greys, glass teal secondary. */
:root{
  --bg:#ECEEED; --surface:#FFFFFF; --sunk:#F5F6F5; --ink:#17201F; --muted:#5D6A68; --line:#D3D9D7;
  --accent:#E8710F; --accent-ink:#FFFFFF; --accent-soft:#FDEBD8; --hero-bg:#C85F0A; --hero-ink:#FFFFFF; --glass:#2D6B70; --glass-soft:#DDEDEE;
  --good:#2C7A4D; --good-soft:#DFF0E5; --warn:#A86E14; --warn-soft:#F7EAD2; --bad:#AE3838; --bad-soft:#F6DEDE;
  --shadow:0 1px 2px rgba(20,30,30,.06),0 4px 14px rgba(20,30,30,.06);
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-disp:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#172020; --sunk:#131A19; --ink:#E5ECEA; --muted:#93A29F; --line:#2A3634;
  --accent:#FFB25C; --accent-ink:#2A1600; --accent-soft:#3A2614; --hero-bg:#5A3210; --hero-ink:#EEF3E6; --glass:#74B9BC; --glass-soft:#1C3234;
  --good:#5FC58E; --good-soft:#1A3326; --warn:#E3A84C; --warn-soft:#3A2D16; --bad:#E57474; --bad-soft:#3C1E1E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#172020; --sunk:#131A19; --ink:#E5ECEA; --muted:#93A29F; --line:#2A3634;
  --accent:#FFB25C; --accent-ink:#2A1600; --accent-soft:#3A2614; --hero-bg:#5A3210; --hero-ink:#EEF3E6; --glass:#74B9BC; --glass-soft:#1C3234;
  --good:#5FC58E; --good-soft:#1A3326; --warn:#E3A84C; --warn-soft:#3A2D16; --bad:#E57474; --bad-soft:#3C1E1E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}button,a,[data-act],[data-tab]{touch-action:manipulation}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
.num,td,.kpi b{font-variant-numeric:tabular-nums}
#app{max-width:860px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.scope{flex-basis:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:15px;text-align:start;min-height:44px}
.scope #scopeName{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.scope.on{border-color:var(--accent);background:var(--accent-soft)}
.scope.on .dot{background:var(--accent)}
.scope .chev{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;text-align:start;cursor:pointer;min-width:0;font:inherit;color:inherit}
.tile .ic{font-size:20px;line-height:1}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbox{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:start;width:100%;font:inherit;color:inherit;border-inline-start:5px solid var(--accent)}
.pbox .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:12px}
.pbox .facts div{background:var(--sunk);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pbox .facts b{font-size:15px;font-variant-numeric:tabular-nums}
.pbox .facts span{color:var(--muted);white-space:nowrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:46px;height:34px;flex:none;object-fit:contain}
.brand h1{font-family:var(--f-disp);font-size:20px;margin:0;line-height:1.1;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}
main{padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-disp);font-size:18px;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)} .sm{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi b{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hero{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero span{color:inherit;opacity:.75}
.kpi.hero b{font-family:var(--f-disp);font-size:28px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.kpi.hero .pos,.kpi.hero .neg{color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--glass);outline-offset:2px}
.fab{position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:28px;cursor:pointer;display:grid;place-items:center}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;cursor:pointer;font-weight:500}
nav.tabs svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button.on{color:var(--accent);font-weight:700}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.mini button{padding:6px 8px;font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters>*{flex:1;min-width:130px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-height:42px}
textarea{min-height:70px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .wide{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:start;width:100%}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.glass{background:var(--glass-soft);color:var(--glass);border-color:transparent}
.daygroup{font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;letter-spacing:.03em}
.av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);flex:none}
.av.lg{width:56px;height:56px;font-size:19px;border-radius:14px;background:var(--ink);color:var(--bg);border:0}
/* tape-measure progress */
.tape{position:relative;height:14px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.tape i{position:absolute;inset-block:0;right:0;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 75%,#fff))}
.tape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),color-mix(in srgb,var(--ink) 30%,transparent) calc(10% - 1px) 10%);mask:linear-gradient(to bottom,#000 0 45%,transparent 45%);-webkit-mask:linear-gradient(to bottom,#000 0 45%,transparent 45%)}
.proj{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:start;width:100%;font:inherit;color:inherit}
.proj .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12.5px}
.proj .stats div{display:flex;flex-direction:column;min-width:0}
.proj .stats b{font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:500}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:56px;height:56px;stroke:var(--muted);opacity:.7}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk)}
tfoot td{font-weight:700;background:var(--sunk)}
/* attendance — daily */
.daybar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.daybar .dlabel{position:relative;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.daybar .dlabel b{font-family:var(--f-disp);font-size:16px;font-weight:600}
.daybar .dlabel input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.daybar .iconbtn{width:44px;height:44px;font-size:20px}
.counts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.counts div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;min-width:0}
.counts b{font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
.counts span{font-size:11px;color:var(--muted)}
.counts .P b{color:var(--good)} .counts .H b{color:var(--warn)} .counts .A b{color:var(--bad)} .counts .R b{color:var(--glass)}
.pgroup{display:flex;flex-direction:column;gap:8px}
.pgroup>h3{display:flex;justify-content:space-between;padding-inline:2px;color:var(--ink)}
.arow{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px 10px;align-items:center}
.arow.st-P{border-inline-start-color:var(--good)} .arow.st-H{border-inline-start-color:var(--warn)} .arow.st-A{border-inline-start-color:var(--bad)} .arow.st-R{border-inline-start-color:var(--glass)}
.arow .who{min-width:0} .arow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .arow .who span{font-size:12px;color:var(--muted)}
.sbtns{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:620px){.arow{grid-template-columns:40px minmax(0,1fr) 300px}.sbtns{grid-column:auto}}
.sbtns button{min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.sbtns button.on[data-s=P]{background:var(--good);color:#fff;border-color:var(--good)}
.sbtns button.on[data-s=H]{background:var(--warn);color:#fff;border-color:var(--warn)}
.sbtns button.on[data-s=A]{background:var(--bad);color:#fff;border-color:var(--bad)}
.sbtns button.on[data-s=R]{background:var(--glass);color:#fff;border-color:var(--glass)}
.ax{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.ax select{min-height:38px;padding:6px 9px;font-size:13.5px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sunk)}
.step button{width:36px;height:36px;border:0;background:none;cursor:pointer;font-size:18px;font-weight:700}
.step span{min-width:78px;text-align:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.sync{font-size:12px;font-weight:600;color:var(--muted)} .sync.ok{color:var(--good)} .sync.err{color:var(--bad)}
/* attendance — monthly sheet */
.ts{min-width:0;font-size:12.5px}
.ts th,.ts td{padding:0;text-align:center;border:1px solid var(--line)}
.ts th{padding:4px 2px;font-size:11px;line-height:1.2}
.ts th.fri{background:var(--accent-soft)}
.ts .nm{position:sticky;right:0;z-index:1;background:var(--surface);text-align:start;padding:6px 8px;min-width:118px;max-width:140px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ts thead .nm{background:var(--sunk);z-index:2}
.ts td.c{width:30px;min-width:30px;height:34px;cursor:pointer;font-weight:700;user-select:none}
.ts td.fri{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.ts td.c-P{background:var(--good-soft);color:var(--good)} .ts td.c-H{background:var(--warn-soft);color:var(--warn)}
.ts td.c-A{background:var(--bad-soft);color:var(--bad)} .ts td.c-R{background:var(--glass-soft);color:var(--glass)}
.ts td.today{outline:2px solid var(--accent);outline-offset:-2px}
.ts td.tot{padding:0 6px;font-weight:700;background:var(--sunk)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:4px}
/* profile */
.phead{display:flex;gap:12px;align-items:center}
.phead .main{flex:1;min-width:0}
.phead .main b{font-family:var(--f-disp);font-size:19px;font-weight:600;display:block;line-height:1.25}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv>div:last-child{border-bottom:0}
.kv>div>span:first-child{color:var(--muted);flex:none}
.kv b,.kv>div>span:last-child{font-variant-numeric:tabular-nums;text-align:end;min-width:0;overflow-wrap:anywhere}
.kv .tot{font-weight:700;font-size:15.5px;border-bottom:0;border-top:2px solid var(--ink);margin-top:4px}
.kv h3{padding-top:8px;color:var(--accent);font-size:12px;letter-spacing:.03em}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:3px}
.strip i{aspect-ratio:1;border-radius:4px;background:var(--sunk);border:1px solid var(--line);font-style:normal;font-size:10px;display:grid;place-items:center;color:var(--muted)}
.strip i.P{background:var(--good);border-color:var(--good);color:#fff} .strip i.H{background:var(--warn);border-color:var(--warn);color:#fff}
.strip i.A{background:var(--bad);border-color:var(--bad);color:#fff} .strip i.R{background:var(--glass);border-color:var(--glass);color:#fff}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.doc .pv{aspect-ratio:1.58;background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-weight:700}
.doc .pv img{width:100%;height:100%;object-fit:cover;display:block}
.doc .meta{padding:6px 8px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.doc .meta b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .acts2{display:flex;border-top:1px solid var(--line)}
.doc .acts2>*{flex:1;border:0;background:none;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;color:var(--glass);text-decoration:none}
.doc .acts2 button.del{color:var(--bad)} .doc .acts2 button.del.armed{background:var(--bad);color:#fff}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.bar .tr{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--glass);border-radius:4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}

/* Files are stored with three fallbacks so an upload never silently disappears:

const MAX_FILE=15*1024*1024;
async function inlinePut(blob){
  let b=blob;if(b.type!=='application/pdf'){b=await toJpeg(blob,1300,.72).catch(()=>blob)}
  if(b.size>1.5*1024*1024)throw {code:'too_big'};

const Files={
  async put(blob){
    if(blob.size>MAX_FILE)throw {code:'too_big'};
    if(IN_CLAUDE){const a=await getCap('assets');if(a){try{const r=await a.upload(blob);return r.id}catch(e){}}}
    try{return await idbPut(blob)}catch(e){}
    try{return await inlinePut(blob)}catch(e){throw e&&e.code?e:{code:'store'}}
  },
  async url(id){id=String(id);if(urlCache[id])return urlCache[id];
    if(id.startsWith('L_')){const b=await idbGet(id).catch(()=>null);return b?(urlCache[id]=URL.createObjectURL(b)):''}
    if(id.startsWith('D_'))return LSget('facade-f-'+id);
    return '/_blob/'+id},
  async del(id){id=String(id);if(id.startsWith('L_'))return idbDel(id).catch(()=>{});if(id.startsWith('D_')){LSset('facade-f-'+id,'');return}const a=await getCap('assets');if(a)a.delete(id).catch(()=>{})}

/* Save picked files as documents. Returns the saved docs, the prepared blobs (for reading), and the first error. */
async function saveFiles(files,docType,exp){
  const docs=[],blobs=[];let err=null;
  for(const f of files){
    let b;try{b=f.type==='application/pdf'?f:await shrink(f)}catch(e){err=err||e;continue}
    if(b.type==='application/pdf'&&b.size>MAX_FILE){err=err||{code:'too_big'};continue}
    blobs.push(b);
    try{docs.push({id:await Files.put(b),type:docType,mime:b.type,name:f.name||'',exp:exp||'',date:today()})}catch(e){err=err||e}
  }
  return {docs,blobs,err};
}

async function toJpeg(file,max,q,enhance){
  if(file.type==='application/pdf')return file;
  const im=await decodeImg(file);const w=im.width||im.naturalWidth,h=im.height||im.naturalHeight;
  const k=Math.min(1,(max||1800)/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);if(enhance)x.filter='grayscale(1) contrast(1.6)';x.drawImage(im,0,0,c.width,c.height);

}

  for(let i=1;i<=Math.min(doc.numPages,20);i++){const pg=await doc.getPage(i);const c=await pg.getTextContent();let lastY=null;
    for(const it of c.items){const y=it.transform[5];t+=(lastY!==null&&Math.abs(y-lastY)>3)?'\n':(lastY!==null?' ':'');t+=it.str;lastY=y}t+='\n'}return t}

  for(let i=1;i<=Math.min(doc.numPages,max||6);i++){const pg=await doc.getPage(i);const v=pg.getViewport({scale:1});const k=Math.min(2.5,1800/Math.max(v.width,v.height));const vp=pg.getViewport({scale:k});

function readBox(kind){
  const t=kind==='id'?['تعبئة تلقائية من الهوية','صوّر الهوية الإماراتية أو الإقامة، الوجه والظهر معاً','📷 تحميل الهوية','image/*']

    :kind==='project'?['تعبئة تلقائية من عقد المشروع','صوّر العقد أو أمر الشراء LPO، أو ارفع PDF','📄 تحميل العقد','image/*,application/pdf']
    :['تعبئة تلقائية من العقد','صوّر صفحات العقد أو ارفع ملف PDF','📄 تحميل العقد','image/*,application/pdf'];
  return `<div class="idbox"><div class="spread"><div style="min-width:0"><b>${t[0]}</b><div class="sm muted">${t[1]}. يمكنك اختيار عدة صفحات.</div></div><label class="btn primary" for="rdFile" style="cursor:pointer">${t[2]}</label></div>
  <input type="file" id="rdFile" accept="${t[3]}" multiple hidden><div class="thumbs" id="rdThumbs"></div><div class="row sm"><span class="muted" id="rdMode">…</span><button type="button" class="btn sm" id="rdSet" hidden>إعداد القراءة الذكية</button></div><div class="idstat" id="rdStat" hidden></div></div>`;
}
const fileThumb=d=>`<div class="thumb"><a data-file="${esc(d.id)}" target="_blank" rel="noopener" style="display:grid;place-items:center;width:100%;height:100%">${(d.mime||'').startsWith('image/')?`<img data-file="${esc(d.id)}" alt="">`:'<span>PDF</span>'}</a><button type="button" class="tx" data-rmf="${esc(d.id)}" aria-label="إزالة الملف">✕</button></div>`;
/* Upload first (always kept), then try to read. persist(docs) saves straight to an existing record so nothing is lost if the form is closed. */
function mountReadBox(sc,d,kind,docType,persist){
  const st=sc.querySelector('#rdStat');const say=(t,c)=>{st.textContent=t;st.className='idstat '+c;st.hidden=false};
  const th=sc.querySelector('#rdThumbs');const shown=normDocs(d).slice();if(shown.length){th.innerHTML=shown.map(fileThumb).join('');hydrate(th)}
  th.addEventListener('click',e=>{const b=e.target.closest('[data-rmf]');if(!b)return;e.preventDefault();const fid=b.dataset.rmf;
    const i=shown.findIndex(x=>x.id===fid);if(i>=0)shown.splice(i,1);d._newDocs=(d._newDocs||[]).filter(x=>x.id!==fid);if(d.docs)d.docs=normDocs(d).filter(x=>x.id!==fid);
    if(persist&&persist.col){const cur=S[persist.col].find(x=>x.id===persist.id);if(cur&&normDocs(cur).some(x=>x.id===fid)){const before=JSON.parse(JSON.stringify(cur));const x=Object.assign({},cur);x.docs=normDocs(x).filter(z=>z.id!==fid);put(persist.col,x);undoToast('حُذف الملف',()=>put(persist.col,before))}}
    th.innerHTML=shown.map(fileThumb).join('');hydrate(th)});
  readMode().then(([k,t])=>{const el=sc.querySelector('#rdMode');if(!el)return;el.textContent=t;el.style.color=k==='ai'?'var(--good)':'';const b=sc.querySelector('#rdSet');if(b&&k!=='ai'&&!IN_CLAUDE){b.hidden=false;b.onclick=settingsSheet}});
  sc.querySelector('#rdFile').onchange=async e=>{
    const files=[...e.target.files].slice(0,12);e.target.value='';if(!files.length)return;
    say(`جارِ رفع ${files.length} ملف…`,'busy');
    const r=await saveFiles(files,docType);
    if(!r.blobs.length){say(readErr(r.err||{code:'decode'}),'err');return}
    if(r.docs.length){if(persist&&d.id)persist(r.docs);else d._newDocs=(d._newDocs||[]).concat(r.docs);shown.push(...r.docs);th.innerHTML=shown.map(fileThumb).join('');hydrate(th)}
    const where=kind==='id'?'مع العامل':kind==='project'?'في مستندات المشروع':kind==='receipt'?'مع المصروف':'في مستندات العامل';
    const saved=r.docs.length?`✓ رُفع ${r.docs.length} ملف ${where}${persist&&d.id?'':' (يُحفظ عند الضغط على حفظ)'}. `:`⚠️ لم يُحفظ الملف: ${readErr(r.err)}. `;
    say(saved+'جارِ قراءة البيانات…','busy');
    try{
      const res=await aiRead(kind,r.blobs,t=>say(saved+t,'busy'));
      if(!res.j||res.j.error)throw {code:res.j&&res.j.error||'not_id'};
      const fields=kind==='id'?mapID(res.j):kind==='project'?mapProject(res.j):kind==='receipt'?mapReceipt(res.j):mapContract(res.j);let c=0;
      if(kind==='id'){['name','nameEn','eid','cardNo','nat','dob','gender','eidExp','visa','trade','occEn','company','emirate','fileNo'].forEach(k=>{const el=sc.querySelector('#f_'+k);if(el&&!(k in fields)&&el.tagName!=='SELECT'){el.value='';el.classList.remove('filled')}})}
      Object.entries(fields).forEach(([k,v])=>{const el=sc.querySelector('#f_'+k);if(el){el.value=v;el.classList.add('filled');c++}});
      const badEid=kind==='id'&&fields.eid&&!eidOk(fields.eid);if(badEid){const el=sc.querySelector('#f_eid');if(el){el.classList.remove('filled');el.classList.add('bad-in')}}
      if(kind!=='id'&&fields.end)r.docs.forEach(x=>x.exp=fields.end);
      say(saved+`عُبّئ ${c} حقل${res.via==='ocr'?' (قراءة على الجهاز، راجعها جيداً)':''}.${badEid?' ⚠︎ رقم الهوية لا يبدو صحيحاً (رقم مقروء خطأ) — قارنه بالبطاقة.':''}${kind==='id'&&!fields.nameEn?' لم يُقرأ الاسم الإنجليزي — صوّر ظهر الهوية أيضاً.':''} راجعها ثم اضغط حفظ.`,badEid?'warn':'ok');
    }catch(err){say(saved+'لم تُقرأ البيانات تلقائياً: '+readErr(err)+' أدخلها يدوياً ثم اضغط حفظ.',r.docs.length?'warn':'err')}
  };
}
function persistTo(col,id){const f=docs=>{const cur=S[col].find(x=>x.id===id);if(!cur)return;const x=Object.assign({},cur);x.docs=normDocs(x).concat(docs);put(col,x)};f.col=col;f.id=id;return f}
function workerForm(w,after){
  const isNew=!w||!w.id;const data=Object.assign({payType:'daily',active:'yes',project:CUR()},w||{});if(isNew&&w&&w.project)data.project=w.project;
  openForm(isNew?'عامل جديد':'تعديل بيانات العامل',F.worker(),data,o=>{
    const cur=o.id&&W(o.id);o.docs=normDocs(cur||o).concat(o._newDocs||[]);delete o._newDocs;return put('workers',o)},
    isNew?null:()=>{remove('workers',data.id);closeSheet()},
    {pre:readBox('id'),mount:(sc,d)=>mountReadBox(sc,d,'id','هوية إماراتية',persistTo('workers',d.id)),after:o=>openProfile(o.id,'info')});
}
/* Put contract o on worker x and derive the pay used by attendance and payroll. Returns a message when pay changed. */
function applyContract(x,o){
  if(!o.kind)o.kind='emp';o.total=n(o.basic)+n(o.housing)+n(o.transport)+n(o.otherAllow);x.contract=o;let msg='';
  if(o.kind==='supply'&&n(o.supplyRate)){if(o.supplyUnit==='month'){x.payType='monthly';x.rate=n(o.supplyRate)}else{x.payType='daily';x.rate=o.supplyUnit==='hour'?n(o.supplyRate)*(n(o.hours)||8):n(o.supplyRate)}msg='حُدّث أجر العامل من سعر التوريد'}
  else if(o.total){x.payType='monthly';x.rate=o.total;msg='حُدّث الراتب الشهري من العقد: '+AED(o.total)}
  if(o.kind==='emp'&&o.company&&!x.company)x.company=o.company;
  if(o.title&&!x.trade)x.trade=o.title;
  if(o.start&&!x.joinDate)x.joinDate=o.start;
  if(o.end)x.docs=normDocs(x).map(d=>isContractDoc(d.type)&&!d.exp?Object.assign({},d,{exp:o.end}):d);
  return msg;
}
/* Review every value read from a document: current vs. from the document, editable, checked when different. */
function reviewSheet({title,defs,current,extracted,via,onApply,onCancel}){
  const lab=(f,v)=>{if(v==null||v==='')return '—';if(f.type==='select'){const o=f.opts.find(o=>String(Array.isArray(o)?o[0]:o)===String(v));return o?(Array.isArray(o)?o[1]:o):v}return f.type==='number'?fmt1(v):v};
  const rows=defs.filter(f=>!f.sec&&extracted[f.k]!=null&&extracted[f.k]!=='');
  if(!rows.length){toast('لم تُستخرج بيانات من الملف');onCancel&&onCancel();return}
  openSheet(`<div class="spread"><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="إغلاق">✕</button></div>
    <div class="alert" style="${via==='ai'?'background:var(--good-soft);color:var(--good)':''}">${via==='ai'?'✓':'⚠︎'} <div>${via==='ai'?`قرأ Claude ${rows.length} حقل من العقد.`:`قراءة على الجهاز: وُجد ${rows.length} حقل. راجع كل قيمة وصحّحها قبل التطبيق.`} عدّل أي قيمة، وألغِ تحديد ما لا تريد تغييره.</div></div>
    <div class="list">${rows.map(f=>{const cur=current[f.k],nv=extracted[f.k],same=String(cur??'')===String(nv);return `<label class="item rv" style="cursor:pointer;align-items:flex-start">

function gratuity(basic,start){if(!start)return 0;const yrs=(new Date()-new Date(start+'T12:00'))/(365.25*864e5);if(yrs<1)return 0;const first=Math.min(yrs,5)*21*basic/30,rest=Math.max(yrs-5,0)*30*basic/30;return Math.min(first+rest,basic*24)}

function mountContractQuick(sc,kind,docType,get,set,onRead){
  const f=sc.querySelector('#cqFile');if(!f)return;
  f.onchange=async e=>{const files=[...e.target.files].slice(0,12);e.target.value='';if(!files.length)return;
    setFlash(`جارِ رفع ${files.length} ملف…`,'busy');
    const r=await saveFiles(files,docType);
    if(!r.docs.length){setFlash('لم يُرفع العقد: '+readErr(r.err||{code:'decode'}),'err');return}
    const x=Object.assign({},get());x.docs=normDocs(x).concat(r.docs);set(x);
    const saved=`✓ رُفع ${r.docs.length} ملف للعقد. `;
    setFlash(saved+'جارِ قراءة البيانات…','busy');
    try{const res=await aiRead(kind,r.blobs,t=>setFlash(saved+t,'busy'));if(!res.j||res.j.error)throw {code:res.j&&res.j.error||'not_contract'};
      setFlash(saved+'✓ قُرئ العقد. راجع البيانات وطبّقها.','ok');
      onRead(kind==='project'?mapProject(res.j):mapContract(res.j),res.via);
    }catch(err){setFlash(saved+'لم تُقرأ البيانات تلقائياً: '+readErr(err),'warn')}};
  /* re-read contract pages already saved on the record */
  const rb=sc.querySelector('#cqRead');if(rb)rb.onclick=async()=>{const cd=normDocs(get()).filter(d=>isContractDoc(d.type));if(!cd.length)return;
    setFlash('جارِ تجهيز صفحات العقد…','busy');
    try{const blobs=[];for(const d of cd.slice(0,8)){const u=await Files.url(d.id);if(!u)continue;const b=await (await fetch(u)).blob();blobs.push(b.type?b:new Blob([b],{type:d.mime||'image/jpeg'}))}
      if(!blobs.length)throw {code:'store'};
      const res=await aiRead(kind,blobs,t=>setFlash(t,'busy'));if(!res.j||res.j.error)throw {code:res.j&&res.j.error||'not_contract'};
      setFlash('✓ قُرئ العقد. راجع البيانات وطبّقها.','ok');onRead(kind==='project'?mapProject(res.j):mapContract(res.j),res.via);
    }catch(err){setFlash('لم تُقرأ البيانات: '+readErr(err),'warn')}};
}

function mainContract(p){

  if(!items){const area=n(p.area),rate=n(p.rate)||(area?n(p.value)/area:0);
    items=area?[{id:'m1',desc:'الأعمال حسب العقد'+(p.scope?' – '+p.scope.slice(0,60):''),unit:'م²',qty:area,rate}]:n(p.value)?[{id:'m1',desc:'الأعمال حسب العقد',unit:'مقطوعية',qty:1,rate:n(p.value)}]:[]}

function invCalc(inv){
  const gross=(inv.lines||[]).reduce((a,l)=>a+lineAmt(l),0);
  const ret=gross*n(inv.retPct)/100,adv=gross*n(inv.advPct)/100,other=n(inv.otherDed);
  const base=gross-ret-adv-other;
  const vat=inv.vatMode==='add'?base*0.05:inv.vatMode==='inc'?base-base/1.05:0;
  const net=inv.vatMode==='add'?base+vat:base;
  const pays=S.payments.filter(x=>x.invoice&&x.invoice===inv.id);const paid=pays.reduce((a,x)=>a+n(x.amount),0);
  const bal=net-paid;
  const st=inv.status==='draft'?'draft':(net>0&&bal<=1)?'paid':paid>0?'partial':(inv.status||'submitted');
  return {gross,ret,adv,other,base,vat,net,paid,bal,st,pays,age:inv.date?-daysTo(inv.date):0};
}

const lastDay=m=>m+'-'+pad(new Date(+m.slice(0,4),+m.slice(5,7),0).getDate());
function rangePreset(pid,k){const m=thisMonth();
  if(k==='month')return [m+'-01',today()];
  if(k==='prev'){const pm=shiftMonth(m,-1);return [pm+'-01',lastDay(pm)]}
  if(k==='since'){const last=S.invoices.filter(i=>i.project===pid&&i.status!=='draft').sort((a,b)=>String(b.to||b.date).localeCompare(String(a.to||a.date)))[0];return [last?addDays(last.to||last.date,1):((P(pid)||{}).start||m+'-01'),today()]}
  const p=P(pid)||{};const firsts=[p.start,...S.attendance.map(a=>a.id),...S.expenses.filter(e=>e.project===pid).map(e=>e.date),...S.meters.filter(x=>x.project===pid).map(x=>x.date)].filter(Boolean).sort();
  return [firsts[0]||m+'-01',today()];
}
const inR=(d,from,to)=>!!d&&(!from||d>=from)&&(!to||d<=to);
function monthsInRange(from,to){const out=[];let m=monthOf(from),e=monthOf(to);let g=0;while(m&&m<=e&&g++<240){out.push(m);m=shiftMonth(m,1)}return out}
function labourRange(pid,from,to){const byW={};let cost=0;
  S.attendance.forEach(d=>{if(!inR(d.id,from,to))return;Object.entries(d.rows||{}).forEach(([wid,r])=>{if(r.proj!==pid)return;const w=W(wid);if(!w)return;const f=attFactor(r.s,w);const c=perDay(w)*f+n(r.ot)*otRate(w);if(!f&&!n(r.ot)&&r.s!=='A')return;
    const b=byW[wid]||(byW[wid]={days:0,abs:0,ot:0,cost:0});b.days+=r.s==='P'?1:r.s==='H'?.5:0;if(r.s==='A')b.abs++;b.ot+=n(r.ot);b.cost+=c;cost+=c})});return {byW,cost}}
function reportData(pid,from,to,incHist){
  const p=P(pid);const s=pStats(p);const rate=s.rate;
  const exps=S.expenses.filter(e=>e.project===pid&&inR(e.date,from,to)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const byCat={};exps.forEach(e=>(byCat[e.cat||'أخرى']||(byCat[e.cat||'أخرى']=[])).push(e));
  const months=monthsInRange(from,to);const fixed=fixedItems(pid).map(it=>{const ms=months.filter(m=>activeIn(it,m));return Object.assign({},it,{months:ms.length,total:ms.length*it.amount})}).filter(x=>x.months);
  const vehicles=S.vehicles.filter(v=>v.project===pid).map(v=>({v,exp:exps.filter(e=>e.vehicle===v.id).reduce((a,e)=>a+n(e.amount),0),rent:(fixed.find(f=>f.src==='v'&&f.id===v.id)||{}).total||0}));
  const lab=labourRange(pid,from,to);
  const mets=S.meters.filter(x=>x.project===pid&&inR(x.date,from,to)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const m2=mets.reduce((a,x)=>a+n(x.area),0);const cumM2=S.meters.filter(x=>x.project===pid&&(!to||x.date<=to)).reduce((a,x)=>a+n(x.area),0)+n(p.hArea);
  const byItem={};mets.forEach(x=>byItem[x.item||'أخرى']=(byItem[x.item||'أخرى']||0)+n(x.area));
  const hrs=manHours(pid,from,to);
  const invs=S.invoices.filter(i=>i.project===pid&&i.status!=='draft'&&inR(i.date,from,to)).map(i=>({i,c:invCalc(i)}));
  const pays=S.payments.filter(x=>x.project===pid&&inR(x.date,from,to));
  let work=p.billing==='manpower'?hrs.normal*n(p.hourRate)+hrs.ot*(n(p.otHourRate)||n(p.hourRate)):m2*rate;
  const invGross=invs.reduce((a,x)=>a+x.c.gross,0);if(!work&&invGross)work=invGross;
  if(incHist){work=Math.max(work,s.execVal);if(n(p.hExp))byCat['مصاريف سابقة (إجمالي)']=[{date:p.start||'',note:'أرقام مُدخلة كإجمالي',amount:n(p.hExp)}];if(n(p.hLab))lab.cost+=n(p.hLab)}
  const expT=exps.reduce((a,e)=>a+n(e.amount),0)+(incHist?n(p.hExp):0),vatT=exps.reduce((a,e)=>a+(e.vat==='add'?n(e.amount)*.05:0),0),fixT=fixed.reduce((a,f)=>a+f.total,0);
  const cost=expT+fixT+lab.cost;
  return {p,s,rate,from,to,exps,byCat,fixed,vehicles,lab,mets,m2,cumM2,byItem,hrs,invs,pays,work,invGross,expT,vatT,fixT,cost,profit:work-cost,
    received:pays.reduce((a,x)=>a+n(x.amount),0)+(incHist?n(p.hRec):0),incHist};
}

/* ---------- reports centre: attendance, payroll, expenses, production, workers, company summary ---------- */
const genHead=(title,sub,from,to,scope)=>`<div class="hd">${coBlock(co())}<div style="text-align:end"><h4>${title}</h4><div>${sub}</div><div><span style="white-space:nowrap">${esc(from||'')}</span> ← <span style="white-space:nowrap">${esc(to||'')}</span></div></div></div>
  <div class="mt"><div><span>النطاق:</span> ${esc(scope)}</div><div><span>تاريخ الإصدار:</span> ${esc(today())}</div></div>`;
const rsec=t=>`<div style="font-weight:700;font-size:14px;border-bottom:2px solid #1b1f1e;padding-bottom:3px;margin-top:6px">${t}</div>`;
const rkv=a=>`<div class="sum" style="min-width:0;margin-inline-start:0;width:100%">${a.map(([k,v,c])=>`<div class="${c||''}"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
const rft=()=>`<div class="ft">صادر ${esc(dmy(today()))} · ${esc(co().company)}</div>`;
function daysBetween(from,to){const d=[];for(let x=from;x<=to&&d.length<62;x=addDays(x,1))d.push(x);return d}
const scopeName=pid=>pid==='_g'?'بدون مشروع (عام)':pid?pName(pid):'كل المشاريع';
const pOk=(pid,v)=>!pid||(pid==='_g'?!v:v===pid);
function attData(from,to,pid){const days=daysBetween(from,to);const map={};S.attendance.forEach(a=>{if(inR(a.id,from,to))map[a.id]=a.rows||{}});
  const ws=S.workers.filter(w=>days.some(d=>{const r=map[d]&&map[d][w.id];return r&&pOk(pid,r.proj)})||(!pid||pid===w.project)&&w.active!=='no'&&(!pid||w.project===pid));
  const rows=ws.map(w=>{const t={P:0,H:0,A:0,R:0,ot:0,cost:0};const cells=days.map(d=>{const r=map[d]&&map[d][w.id];if(!r||!pOk(pid,r.proj))return '';t[r.s]=(t[r.s]||0)+1;t.ot+=n(r.ot);t.cost+=perDay(w)*attFactor(r.s,w)+n(r.ot)*otRate(w);return r.s});return {w,cells,t}});
  return {days,rows}}
function attHTML(from,to,pid){const {days,rows}=attData(from,to,pid);const T=rows.reduce((a,r)=>{['P','H','A','R','ot','cost'].forEach(k=>a[k]+=r.t[k]);return a},{P:0,H:0,A:0,R:0,ot:0,cost:0});
  const col={P:'#1f7a3f',H:'#a86b00',A:'#b3261e',R:'#3b6e8f'};
  const grid=`<div class="tw"><table style="font-size:8.5px"><thead><tr><th>العامل</th>${days.map(d=>`<th style="padding:2px 1px">${+d.slice(8)}</th>`).join('')}<th>ح</th><th>غ</th><th>إضافي</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="white-space:nowrap">${esc(r.w.name)}</td>${r.cells.map(s=>`<td style="padding:2px 1px;text-align:center;color:${col[s]||'#999'};font-weight:700">${s?ST_LET[s]:'·'}</td>`).join('')}<td class="n">${fmt1(r.t.P+r.t.H/2)}</td><td class="n">${r.t.A||''}</td><td class="n">${fmt1(r.t.ot)||''}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="invdoc">${genHead('تقرير الحضور والغياب','Attendance Report',from,to,scopeName(pid))}
  ${rkv([['عدد العمال',rows.length],['أيام حضور كاملة',T.P],['أنصاف أيام',T.H],['أيام غياب',T.A,T.A?'':''],['أيام راحة',T.R],['ساعات إضافية',fmt1(T.ot)],['تكلفة العمالة للفترة',AED(T.cost),'g']])}
  ${rsec('ملخص كل عامل')}
  ${rows.length?T2(['#','العامل','المهنة','حاضر','نص','غائب','راحة','نسبة الحضور','إضافي س','التكلفة'],rows.sort((a,b)=>b.t.A-a.t.A).map((r,i)=>{const wd=r.t.P+r.t.H+r.t.A;return `<tr><td>${i+1}</td><td>${esc(r.w.name)}</td><td>${esc(r.w.trade||'')}</td><td class="n">${r.t.P}</td><td class="n">${r.t.H||''}</td><td class="n" style="${r.t.A?'color:#b3261e;font-weight:700':''}">${r.t.A||''}</td><td class="n">${r.t.R||''}</td><td class="n">${wd?Math.round((r.t.P+r.t.H/2)/wd*100)+'٪':'—'}</td><td class="n">${fmt1(r.t.ot)||''}</td><td class="n">${fmt(r.t.cost)}</td></tr>`}),['','المجموع','',T.P,T.H,T.A,T.R,'',fmt1(T.ot),fmt(T.cost)]):'<div>لا يوجد حضور مسجّل في الفترة.</div>'}
  ${rows.length?rsec('كشف الأيام')+grid+'<div class="sm">ح = حاضر · ن = نص يوم · غ = غائب · ر = راحة</div>':''}${rft()}</div>`}
function attCSV(from,to,pid){const {days,rows}=attData(from,to,pid);return [['العامل','المهنة',...days,'حاضر','نص','غائب','راحة','إضافي','التكلفة'],...rows.map(r=>[r.w.name,r.w.trade||'',...r.cells.map(s=>s?ST_LET[s]:''),r.t.P,r.t.H,r.t.A,r.t.R,r.t.ot,Math.round(r.t.cost)])]}
function payHTML(m,pid){const ws=payWorkers(m).filter(w=>!pid||w.project===pid||(pid==='_g'&&!w.project));const ps=ws.map(w=>({w,p:payCalc(w,m)}));
  const T=ps.reduce((a,{p})=>{a.g+=p.gross;a.net+=p.net;a.abs+=p.absDed;a.ot+=p.otAmt;a.adj+=p.adj;a.paid+=p.paid?n(p.paid.amount):0;return a},{g:0,net:0,abs:0,ot:0,adj:0,paid:0});

function plData(from,to,pid){const {rows,gen,T}=sumData(from,to);if(!pid)return {rows,gen,T,net:T.profit-gen};
  const rs=rows.filter(r=>pOk(pid,r.p.id));const T2_=rs.reduce((a,r)=>{['m2','exec','exp','lab','rec','profit'].forEach(k=>a[k]+=r[k]);return a},{m2:0,exec:0,exp:0,lab:0,rec:0,profit:0});
  return {rows:rs,gen:0,T:T2_,net:T2_.profit}}
function plHTML(from,to,pid){const d=plData(from,to,pid);const pos=d.net>=0;const mg=d.T.exec?Math.round(d.net/d.T.exec*100):0;
  return `<div class="invdoc">${genHead('تقرير الربح والخسارة','Profit & Loss Statement',from,to,scopeName(pid))}
  ${rkv([['قيمة الأعمال المنفّذة',AED(d.T.exec)],['− مصاريف المشاريع',AED(d.T.exp)],['− تكلفة العمالة',AED(d.T.lab)],...(pid?[]:[['− مصاريف عامة للشركة',AED(d.gen)]]),[pos?'= صافي الربح':'= صافي الخسارة',AED(Math.abs(d.net)),'g'],['هامش الربح',d.T.exec?mg+'٪':'—'],['المستلم من العملاء في الفترة',AED(d.T.rec)]])}
  ${d.rows.length?rsec('ربح / خسارة كل مشروع')+T2(['المشروع','المنفّذ','مصاريف','عمالة','الربح / الخسارة','الهامش'],d.rows.sort((a,b)=>b.profit-a.profit).map(r=>`<tr><td>${esc(r.p.name)}</td><td class="n">${fmt(r.exec)}</td><td class="n">${fmt(r.exp)}</td><td class="n">${fmt(r.lab)}</td><td class="n" style="color:${r.profit<0?'#b3261e':'#1f7a3f'}"><b>${fmt(r.profit)}</b></td><td class="n">${r.exec?Math.round(r.profit/r.exec*100)+'٪':'—'}</td></tr>`),['المجموع',fmt(d.T.exec),fmt(d.T.exp),fmt(d.T.lab),fmt(d.T.profit),'']):'<div>لا توجد حركة في الفترة.</div>'}

function plCSV(from,to,pid){const d=plData(from,to,pid);return [['المشروع','المنفّذ','مصاريف','عمالة','الربح'],...d.rows.map(r=>[r.p.name,Math.round(r.exec),Math.round(r.exp),Math.round(r.lab),Math.round(r.profit)]),...(pid?[]:[['مصاريف عامة','','','',-Math.round(d.gen)]]),['الصافي','','','',Math.round(d.net)]]}

function repCtx(k){const R=REP2.find(x=>x.k===k);const [f0,t0]=repRange();const m=f0.slice(0,7);const f=R.month?m+'-01':f0,t=R.month?lastDay(m):t0;const pid=repPid();

function repMsg(c){const v=String(c.R.v(c.f,c.t,c.pid)).replace(/<[^>]+>/g,'');

async function copyTxt(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
async function repSend(k,how){const c=repCtx(k);const msg=repMsg(c);toast(TL('جارِ تجهيز PDF…','Preparing PDF…'));

function parseQuoteText(t){const out={items:[]};const s=String(t||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.');
  const g=(re)=>{const m=s.match(re);return m?m[1].trim():null};
  out.client=g(/(?:لشركة|لشركه|شركة|شركه|لمكتب|مكتب|لمؤسسة|مؤسسة|للسيد|السيد|العميل|client|to)\s*[:：]?\s*([^\n،,.:：\-–\d]{2,50})/i);if(out.client)out.client=out.client.replace(/\s+(?:مشروع|في|ب|بـ)$/,'').trim();
  out.project=g(/(?:مشروع|project)\s*[:：]?\s*([^\n،,.:：]{2,60})/i)||g(/[-–]\s*([^\n،,.:：]{3,50})\s*[:：]/);out.attn=g(/(?:عناية|attn)\s*[:：]?\s*([^\n،,]{2,40})/i);
  out.location=(s.match(/دبي|أبوظبي|ابوظبي|الشارقة|الشارقه|عجمان|رأس الخيمة|راس الخيمه|الفجيرة|أم القيوين|العين|جبل علي/)||[])[0]||null;
  out.phone=g(/((?:\+?971|0)5\d[\d\s]{7,10})/);
  const dp=s.match(/خصم\s*(\d+(?:\.\d+)?)\s*[%٪]/);if(dp)out.disc_pct=+dp[1];
  if(/بدون ضريب|بدون vat|غير شامل الضريب|no vat/i.test(s))out.vat=false;
  const du=s.match(/(?:مدة|خلال|المدة)(?:\s*(?:التنفيذ|العمل|التسليم))?\s*[:：]?\s*(\d+\s*(?:يوم|أيام|ايام|اسبوع|أسبوع|أسابيع|اسابيع|شهر|أشهر|اشهر|شهور))/);if(du)out.duration=du[1];
  const ad=s.match(/(\d+)\s*[%٪]\s*(?:دفعة\s*)?(?:مقدم|مقدمة|مقدمه|advance)/)||s.match(/(?:دفعة\s*)?(?:مقدم[ةه]?|advance)\s*(\d+)\s*[%٪]/);if(ad)out.payment=ad[1]+'٪ دفعة مقدمة، والباقي دفعات شهرية حسب الإنجاز.';
  const va=s.match(/(?:صلاحية|صالح|validity)\D{0,10}(\d+)\s*(?:يوم|days)/i);if(va)out.validity_days=+va[1];
  const U=[[/م2|م²|متر مربع|مترمربع|sqm|m2/i,'م²'],[/م\.?\s?ط|متر طولي|طولي|lm|rm/i,'م.ط'],[/عدد|حبة|حبه|قطعة|قطعه|pcs|nos|شباك|باب/i,'عدد'],[/متر|m\b/i,'م²']];
  s.split(/\n|؛|;|،|[.:：](?=\s)|\s[-–]\s|(?<=\d)\s+و(?=\S)/).forEach(seg=>{seg=seg.replace(/(?:عدد|كمية|الكمية)\s*(\d+)/,'$1 عدد');const lump=seg.match(/مقطوعي[ةه]\s*(?:بسعر|ب)?\s*(\d[\d,]*)/);if(lump&&!/\d\s*(?:م2|م²|متر|م\.ط)/.test(seg)){const q1=(seg.match(/(\d+)\s*عدد/)||[])[1];const desc=seg.replace(/(\d+\s*عدد|مقطوعي[ةه][\s\S]*)/g,'').replace(/^\s*و/,'').trim();out.items.push({desc:desc||'بند',desc_en:'',spec:'',unit:'مقطوعية',qty:1,rate:+lump[1].replace(/,/g,''),note:q1?q1+' عدد':''});if(q1)out.items[out.items.length-1].desc+=' ('+q1+' عدد)';return}
    const m=seg.match(/(\d[\d,]*(?:\.\d+)?)\s*(م2|م²|متر مربع|مترمربع|متر طولي|م\.\s?ط|م ط|متر|sqm|m2|lm|عدد|حبة|حبه|قطعة|قطعه|pcs|nos)/i);if(!m)return;
    const qty=+m[1].replace(/,/g,'');let unit='م²';for(const [re,u] of U)if(re.test(m[2])){unit=u;break}
    const after=seg.slice(m.index+m[0].length);const rm=after.match(/(?:بسعر|سعر|السعر|ب|بـ|@|×|x|\*)\s*(\d[\d,]*(?:\.\d+)?)/i)||after.match(/(\d[\d,]*(?:\.\d+)?)\s*(?:درهم|aed|dhs)/i);
    let desc=seg.slice(0,m.index).replace(/^(?:\s*[-•*\d.)]+\s*)/,'').replace(/^\s*و(?=\S)/,'').replace(/(?:لشركة|شركة|مشروع)\s*[^،,]*[،,]/,'').replace(/\b(?:عدد|كمية|الكمية)\s*$/,'').replace(/[:：،,]\s*$/,'').trim();
    if(!desc)desc=after.replace(/(?:بسعر|سعر)[\s\S]*/,'').trim()||'بند';

  const tot=`<div class="qd-tot">${[[qL(q,'المجموع','Subtotal'),fmt(c.sub)],c.disc?[qL(q,'الخصم','Discount')+(n(q.discPct)?' ('+n(q.discPct)+'٪)':''),'− '+fmt(c.disc)]:null,c.disc?[qL(q,'بعد الخصم','Net'),fmt(c.net)]:null,c.vat?[qL(q,'ضريبة القيمة المضافة 5٪','VAT 5%'),fmt(c.vat)]:null,[qL(q,'الإجمالي (درهم)','Total (AED)'),fmt(c.total),1]].filter(Boolean).map(([k,v,g])=>`<div class="${g?'g':''}"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;

/* ---------- generic: lay blocks out on the letterhead, page by page ---------- */
async function lhLayout(seq,th,en,cls){const lh=LH();if(!lh||!lh.id)return null;
  const u1=await Files.url(lh.id),u2=lh.id2?await Files.url(lh.id2):u1;const W=794,H=1123;
  const pad=`padding:${H*n(lh.top??18)/100}px ${W*n(lh.side??7)/100}px ${H*n(lh.bottom??10)/100}px`;
  const wipe=lh.clean!==false?`<div class="qwipe" style="top:${n(lh.top??18)}%;bottom:${n(lh.bottom??10)}%"></div>`:'';
  const page=(bg,inner)=>`<div class="qpage" style="width:${W}px;height:${H}px"><img class="qbg" src="${bg}" alt="">${wipe}<div class="qbox" dir="${en?'ltr':'rtl'}" style="${pad}"><div class="qin">${inner}</div></div></div>`;
  const host=document.createElement('div');host.className='pdfhost';host.dir='rtl';document.body.appendChild(host);
  const fits=(bg,inner)=>{host.innerHTML=page(bg,inner);const inn=host.querySelector('.qin'),box=host.querySelector('.qbox');return inn.scrollHeight<=box.clientHeight-parseFloat(getComputedStyle(box).paddingTop)-parseFloat(getComputedStyle(box).paddingBottom)+1};
  const tbl=rs=>rs.length?`<div class="tw"><table>${th}<tbody>${rs.join('')}</tbody></table></div>`:'';
  const pages=[];let cur=[],first=true;const html=items=>{let out='',rs=[];for(const it of items){if(it.r){rs.push(it.r);continue}if(rs.length){out+=tbl(rs);rs=[]}out+=it.h}return out+tbl(rs)};
  const wrap=h=>`<div class="invdoc ${cls||'qdoc'}">${h}</div>`;
  try{await waitImgs(host);for(const it of seq){if(it.brk){if(cur.length){pages.push(page(first?u1:u2,wrap(html(cur))));first=false;cur=[]}continue}
      const bg=first?u1:u2;const tryI=cur.concat([it]);if(fits(bg,wrap(html(tryI)))||!cur.length){cur=tryI;continue}
      pages.push(page(bg,wrap(html(cur))));first=false;cur=[it]}
    if(cur.length)pages.push(page(first?u1:u2,wrap(html(cur))));
    if(pages.length>1)pages.forEach((p,i)=>pages[i]=p.slice(0,-6)+`<div class="qpn">${i+1} / ${pages.length}</div></div>`);
  }finally{host.remove()}return pages}

async function quoteView(id){const q=S.quotes.find(x=>x.id===id);if(!q){toast('العرض غير موجود');return}const c=qCalc(q);const lh=LH();
  openSheet(`<div class="spread"><h2>📝 ${esc(q.no)}</h2><button class="iconbtn" data-close aria-label="إغلاق">✕</button></div>
    <div class="spread"><div><b>${esc(q.client||'')}</b><div class="sm muted">${esc(q.project||q.subject||'')}</div></div><b style="font-size:18px">${AED(c.total)}</b></div>
    <div class="row">${Object.entries(Q_ST).map(([k,[l,cl]])=>`<button class="pill ${cl} ${q.status===k?'on':''}" data-st="${k}" style="cursor:pointer;border:${q.status===k?'2px solid currentColor':'1px solid transparent'}">${l}</button>`).join('')}</div>
    <button class="btn primary block" data-x="pdf" style="background:#25D366;border-color:#25D366;color:#fff">📤 PDF — واتساب / إيميل</button>
    <div class="row"><button class="btn" data-x="edit" style="flex:1">✎ تعديل</button><button class="btn" data-x="ai" style="flex:1">✨ عدّل بالذكاء</button></div>
    <div class="row"><button class="btn" data-x="lh" style="flex:1">🖼 ${lh&&lh.id?'الترويسة ✓':'أضف ترويسة شركتك'}</button><button class="btn" data-x="dup" style="flex:1">📋 نسخة جديدة</button></div>
    <div class="row"><button class="btn" data-x="proj" style="flex:1">🏗 ${q.status==='won'?'حوّله إلى مشروع':'قُبل؟ حوّله لمشروع'}</button><button class="btn danger" data-x="del">🗑</button></div>
    <div id="qPrev" class="qprev"><div class="loading">جارِ تجهيز المعاينة…</div></div>`,async sc=>{
    sc.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{put('quotes',Object.assign({},q,{status:b.dataset.st,[b.dataset.st+'At']:today()}));quoteView(id)});
    sc.querySelector('[data-x=edit]').onclick=()=>quoteForm(q);sc.querySelector('[data-x=ai]').onclick=()=>quoteAI(q);
    sc.querySelector('[data-x=lh]').onclick=()=>letterheadSheet(()=>quoteView(id));
    sc.querySelector('[data-x=dup]').onclick=()=>{const d=JSON.parse(JSON.stringify(q));delete d.id;d.no=nextQuoteNo();d.date=today();d.status='draft';quoteForm(d)};
    sc.querySelector('[data-x=del]').onclick=()=>{closeSheet();remove('quotes',id)};
    sc.querySelector('[data-x=proj]').onclick=()=>{closeSheet();if(q.status!=='won')put('quotes',Object.assign({},q,{status:'won',wonAt:today()}));
      projectForm({name:q.project||q.subject||q.client,client:q.client,location:q.location||'',billing:'boq',start:today(),status:'قيد التنفيذ',quote:q.id,note:'من عرض السعر '+q.no,
        items:(q.items||[]).map((l,i)=>({id:'it'+uid()+i,desc:l.desc,unit:l.unit,qty:n(l.qty),rate:n(l.rate)})),value:qCalc(q).net},()=>render())};
    sc.querySelector('[data-x=pdf]').onclick=()=>shareSheet({title:'إرسال العرض '+q.no,name:'عرض سعر '+q.no+' - '+(q.client||''),msg:msgQuote(q),subject:(q.lang==='en'?'Quotation ':'عرض سعر ')+q.no+' — '+(q.lang==='en'?(co().companyEn||co().company):co().company),text:`${co().company}\nعرض سعر ${q.no}${q.project?' — '+q.project:''}\nالإجمالي: ${AED(c.total)}`,
      build:async()=>{const pg=await quotePages(q);if(q.status==='draft')put('quotes',Object.assign({},q,{status:'sent',sentAt:today()}));return {parts:pg?pg.map(h=>({page:true,html:h})):[pdfWrap(quoteDocHTML(q))],images:[]}}});
    const pv=sc.querySelector('#qPrev');const pg=await quotePages(q).catch(()=>null);showPages(pv,pg,quoteDocHTML(q));
  })}
/* the company's own form (letterhead): photo or PDF, with adjustable free area */
function letterheadSheet(back){const lh=Object.assign({top:18,bottom:10,side:7},LH()||{});
  openSheet(`<div class="spread"><h2>🖼 ترويسة الشركة</h2><button class="iconbtn" data-close aria-label="إغلاق">✕</button></div>
    <p class="sm" style="margin:0">ارفع ورقة شركتك الرسمية (الترويسة) كصورة أو PDF: صفحة فارغة فيها الشعار فوق والعنوان تحت. التطبيق يكتب العرض في المساحة الفارغة، ويضيف صفحات إذا طال العرض.</p>
    <div class="row"><label class="btn" style="cursor:pointer;flex:1">📄 ${lh.id?'تغيير الترويسة':'رفع الترويسة'}<input type="file" id="lh1" accept="image/*,application/pdf" hidden></label>
    <label class="btn" style="cursor:pointer;flex:1">📄 صفحة المتابعة (اختياري)<input type="file" id="lh2" accept="image/*,application/pdf" hidden></label></div>
    <div class="idstat" id="lhSt" hidden></div>
    ${lh.id&&lh.filled?`<div class="alert">🧽 <div>هذه الصفحة فيها كتابة قديمة (فاتورة أو عرض). سيمسح التطبيق كل ما بين الخطين ويبقي الترويسة فوق والتذييل تحت فقط. حرّك الأشرطة حتى يبقى الشعار وبيانات الشركة فقط خارج المربع.<br>إذا كنت تريد <b>تحديث هذا العرض القديم</b> فاستخدم «📎 حدّث عرضاً قديماً» في تبويب العروض.</div></div>`:''}
    ${lh.id?`<label class="item" style="cursor:pointer"><input type="checkbox" id="lhC" ${lh.clean!==false?'checked':''} style="width:22px;min-height:22px;flex:none"><div class="main"><div class="t">🧽 امسح أي كتابة قديمة داخل المربع</div><div class="s">اتركه مفعّلاً إذا رفعت فاتورة أو عرضاً قديماً بدل ورقة فارغة</div></div></label>`:''}
    ${lh.id?`<div class="grid2"><label class="f">المسافة من فوق ٪<input type="range" id="lhT" min="0" max="45" value="${lh.top}"></label><label class="f">المسافة من تحت ٪<input type="range" id="lhB" min="0" max="35" value="${lh.bottom}"></label>
      <label class="f wide">الهوامش الجانبية ٪<input type="range" id="lhS" min="2" max="20" value="${lh.side}"></label></div>
      <div class="lhprev" id="lhPrev"><img id="lhImg" alt="الترويسة"><div class="lhbox" id="lhBox"><span>هنا يُكتب العرض</span></div></div>
      <div class="row"><button class="btn primary" id="lhSave" style="flex:1">💾 حفظ</button><button class="btn danger" id="lhDel">إزالة الترويسة</button></div>`:''}
    ${back?'<button class="btn block" id="lhBack">‹ رجوع للعرض</button>':''}`,async sc=>{
    const st=sc.querySelector('#lhSt');const say=(t,c)=>{st.hidden=false;st.textContent=t;st.className='idstat '+c};
    const up=async(f,key)=>{if(!f)return;say('جارِ الرفع…','busy');try{let b=f;if(f.type==='application/pdf'){say('تحويل الـ PDF إلى صورة…','busy');b=(await pdfImages(f,1))[0];if(!b)throw {code:'pdf_load'}}else b=await shrinkTo(f,1800);
        const an=key==='id'?await analyzeLH(b):null;const id=await Files.put(b);const nl=Object.assign({},lh,{[key]:id});
        if(an){if(an.top!=null)nl.top=an.top;if(an.bottom!=null)nl.bottom=an.bottom;nl.clean=true;nl.filled=an.filled}put('settings',Object.assign({},S.settings,{id:'main',lh:nl}));S.settings.lh=nl;toast(nl.filled?'✓ رُفعت — فيها كتابة قديمة، سيُمسح الوسط تلقائياً':'✓ رُفعت الترويسة');letterheadSheet(back)}catch(e){say(readErr(e),'err')}};
    sc.querySelector('#lh1').onchange=e=>up(e.target.files[0],'id');sc.querySelector('#lh2').onchange=e=>up(e.target.files[0],'id2');
    sc.querySelector('#lhBack')?.addEventListener('click',back);
    if(!lh.id)return;const img=sc.querySelector('#lhImg');img.src=await Files.url(lh.id);
    const box=sc.querySelector('#lhBox');const wp=document.createElement('div');wp.className='lhwipe';box.before(wp);
    const upd=()=>{box.style.top=lh.top+'%';box.style.bottom=lh.bottom+'%';box.style.left=box.style.right=lh.side+'%';wp.style.top=lh.top+'%';wp.style.bottom=lh.bottom+'%';wp.hidden=lh.clean===false};upd();
    sc.querySelector('#lhC').onchange=e=>{lh.clean=e.target.checked;upd()};
    [['#lhT','top'],['#lhB','bottom'],['#lhS','side']].forEach(([s,k])=>sc.querySelector(s).oninput=e=>{lh[k]=+e.target.value;upd()});
    sc.querySelector('#lhSave').onclick=()=>{put('settings',Object.assign({},S.settings,{id:'main',lh}));S.settings.lh=lh;toast('✓ حُفظت الترويسة');back?back():closeSheet()};
    sc.querySelector('#lhDel').onclick=()=>{const st2=Object.assign({},S.settings,{id:'main'});delete st2.lh;put('settings',st2);toast('أُزيلت الترويسة');back?back():closeSheet()};
  })}
/* look at the uploaded page: where does the header end, where does the footer start, and is the middle already written on? */
async function analyzeLH(blob){try{const im=await decodeImg(blob);const w=im.width||im.naturalWidth,h=im.height||im.naturalHeight;const W=160,H=Math.round(160*h/w);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
  const ink=[];for(let y=0;y<H;y++){let k=0;for(let i=0;i<W;i++){const p=(y*W+i)*4;if(d[p]*.3+d[p+1]*.59+d[p+2]*.11<215)k++}ink.push(k/W)}
  const blank=y=>ink[y]<0.012;const band=Math.max(2,Math.round(H*0.012));

function wordsAr(n0){n0=Math.floor(Math.abs(n0));if(!n0)return 'صفر';
  const O=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const T=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const H=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const u999=x=>{const h=Math.floor(x/100),r=x%100;const p=[];if(h)p.push(H[h]);if(r){if(r<20)p.push(O[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?O[o]+' و'+T[t]:T[t])}}return p.join(' و')};

  const parts=[];let x=n0;
  for(const [v,one,two,many] of G){const k=Math.floor(x/v);x%=v;if(!k)continue;
    if(k===1)parts.push(one);else if(k===2)parts.push(two);else if(k<=10)parts.push(u999(k)+' '+many);else parts.push(u999(k)+' '+one)}
  if(x)parts.push(u999(x));return parts.join(' و')}
function wordsEn(n0){n0=Math.floor(Math.abs(n0));if(!n0)return 'Zero';

  const T=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const u999=x=>{const h=Math.floor(x/100),r=x%100;const p=[];if(h)p.push(O[h]+' Hundred');if(r)p.push(r<20?O[r]:T[Math.floor(r/10)]+(r%10?'-'+O[r%10]:''));return p.join(' and ')};
  const parts=[];let x=n0;for(const [v,w] of [[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']]){const k=Math.floor(x/v);x%=v;if(k)parts.push(u999(k)+' '+w)}

async function buildBackup(){const d={app:'facade-ledger',v:2,at:new Date().toISOString()};COLS.forEach(c=>d[c]=c==='settings'?[S.settings]:S[c]);
  d._files={};const lhIds=[(S.settings.lh||{}).id,(S.settings.lh||{}).id2].filter(Boolean).map(id=>({id}));

    try{if(fid.startsWith('L_')){const b=await idbGet(fid).catch(()=>null);if(b)d._files[fid]={type:b.type,data:await blobB64(b)}}
      else if(fid.startsWith('D_')){const u=LSget('facade-f-'+fid);if(u)d._files[fid]={url:u}}

async function bulkIDs(files){
  files=[...files];if(!files.length)return;
  openSheet(`<div class="spread"><h2>إضافة عمال من الهويات</h2><button class="iconbtn" data-close aria-label="إغلاق">✕</button></div>
    <p class="sm muted" style="margin:0">كل صورة = عامل واحد. إذا كان رقم الهوية موجوداً يُحدَّث العامل بدل تكراره. أدخل الأجر لكل عامل بعد ذلك.</p>
    <div class="list">${files.map((f,i)=>`<div class="item" style="cursor:default" id="bk${i}"><div class="main"><div class="t">${esc(f.name)}</div><div class="s">بالانتظار…</div></div></div>`).join('')}</div>`);
  let ok=0;
  for(const [i,f] of files.entries()){
    const row=document.getElementById('bk'+i),sub=row?.querySelector('.s'),tt=row?.querySelector('.t');
    if(sub)sub.textContent='جارِ القراءة…';
    try{const b=await shrink(f);const [r,fid]=await Promise.all([aiRead('id',[b]),Files.put(b).catch(()=>null)]);
      if(!r.j||r.j.error)throw {code:'not_id'};
      const fields=mapID(r.j);if(!fields.name)throw {code:'not_id'};
      const ex=fields.eid&&S.workers.find(w=>w.eid&&w.eid.replace(/\D/g,'')===fields.eid.replace(/\D/g,''));
      const w=Object.assign({payType:'daily',active:'yes',rate:''},ex||{},fields);
      w.docs=normDocs(ex||{}).concat(fid?[{id:fid,type:'هوية إماراتية',mime:b.type,date:today(),exp:fields.eidExp||''}]:[]);
      put('workers',w);ok++;
      if(tt)tt.textContent=w.name;if(sub){sub.textContent=(ex?'حُدّث · ':'أُضيف · ')+[w.trade,w.company].filter(Boolean).join(' · ')+(r.via==='ocr'?' · راجع البيانات':'');sub.style.color='var(--good)'}
    }catch(err){if(sub){sub.textContent=readErr(err);sub.style.color='var(--bad)'}}
  }
  toast(`تمت قراءة ${ok} من ${files.length}`);
}

const csv=rows=>'﻿'+rows.map(r=>r.map(c=>{c=String(c??'');return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
async function save(name,data,type){
  const blob=new Blob([data],{type:type||'text/csv;charset=utf-8'});
  if(NATIVE&&CapP('Share')){try{await shareBlobs([new File([blob],name,{type:blob.type})],{title:name})}catch(e){toast(readErr(e))}return}
  if(IN_CLAUDE){try{const dl=await getCap('downloads');if(dl){await dl.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='declined')return}toast('التنزيل غير متاح هنا');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function exportPay(){const m=UI.payMonth;
  const rows=[['العامل','المهنة','رقم الهوية','البنك / WPS','نوع الأجر','الراتب/اليومية','اليومية','حاضر','نص يوم','غائب','راحة','ساعات إضافية','الأساسي','خصم الغياب','الإضافي','مكافآت','الإجمالي','سلف','خصومات','الصافي','الحالة']];
  let tn=0;payWorkers(m).forEach(w=>{const p=payCalc(w,m);tn+=p.net;rows.push([w.name,w.trade,w.eid,[w.bank,w.iban].filter(Boolean).join(' '),w.payType==='monthly'?'شهري':'يومي',w.rate,p.pd.toFixed(2),p.c.P,p.c.H,p.c.A,p.c.R,p.c.ot,p.base.toFixed(2),p.absDed.toFixed(2),p.otAmt.toFixed(2),p.adj.bonus,p.gross.toFixed(2),p.adj.adv,p.adj.ded,p.net.toFixed(2),p.paid?'مدفوع '+p.paid.date:'غير مدفوع'])});
  rows.push(['المجموع','','','','','','','','','','','','','','','','','','',tn.toFixed(2),'']);
  save('رواتب-'+m+'.csv',csv(rows))}
function exportExp(){const rows=[['التاريخ','المشروع','البند','المورد','المبلغ','ضريبة 5%','الإجمالي','ملاحظة']];
  S.expenses.filter(x=>(!UI.mFilterM||(x.date||'').startsWith(UI.mFilterM))).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(e=>rows.push([e.date,pName(e.project),e.cat,e.supplier,e.amount,e.vat==='add'?(n(e.amount)*.05).toFixed(2):0,expTotal(e).toFixed(2),e.note]));
  save('مصاريف-'+(UI.mFilterM||'الكل')+'.csv',csv(rows))}
function exportTS(){const m=UI.attMonth,[y,mo]=m.split('-').map(Number),nd=new Date(y,mo,0).getDate();const days=[...Array(nd)].map((_,i)=>`${m}-${pad(i+1)}`);
  const map={};S.attendance.forEach(a=>{if(a.id.startsWith(m))map[a.id]=a.rows||{}});const lab=labour(d=>d.startsWith(m)).byW;
  const rows=[['العامل','المهنة',...days.map(d=>+d.slice(8)),'أيام مدفوعة','غياب','إضافي']];
  S.workers.filter(w=>w.active!=='no'||days.some(d=>map[d]?.[w.id])).forEach(w=>{const b=lab[w.id]||{};rows.push([w.name,w.trade,...days.map(d=>{const r=map[d]?.[w.id];return r?ST_LET[r.s]+(n(r.ot)?'+'+r.ot:''):''}),b.days||0,b.A||0,b.ot||0])});
  save('كشف-حضور-'+m+'.csv',csv(rows))}

    .forEach(([id,di,project,cat,amount,vat,supplier])=>put('expenses',{id,date:days[di]||today(),project,cat,amount,vat,supplier,note:'بيانات تجريبية'}));

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('.sheet'))return;
  const t=e.target.closest('[data-tab]');if(t){UI.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  const g=e.target.closest('[data-tab-go]');if(g){UI.tab=g.dataset.tabGo;render();window.scrollTo(0,0);return}
  const ws=e.target.closest('[data-wseg]');if(ws){UI.wseg=ws.dataset.wseg;render();return}
  const am=e.target.closest('[data-attmode]');if(am){UI.attMode=am.dataset.attmode;render();return}
  const qf=e.target.closest('[data-qf]');if(qf){UI.qF=qf.dataset.qf;render();return}
  const ms=e.target.closest('[data-mseg]');if(ms){UI.mseg=ms.dataset.mseg;render();return}
  const ps=e.target.closest('[data-pseg]');if(ps){UI.pseg=ps.dataset.pseg;render();return}
  const wf=e.target.closest('[data-wf]');if(wf){UI.wf=wf.dataset.wf;render();return}
  const wg=e.target.closest('[data-wg]');if(wg){UI.wg=wg.dataset.wg;render();return}
  const iv=e.target.closest('[data-invf]');if(iv){UI.invF=iv.dataset.invf;render();return}
  const rsg=e.target.closest('[data-rseg]');if(rsg){UI.rseg=rsg.dataset.rseg;render();return}
  const rpr=e.target.closest('[data-rpre]');if(rpr){UI.rpre=rpr.dataset.rpre;if(UI.rpre==='custom'&&!UI.rfrom){UI.rfrom=thisMonth()+'-01';UI.rto=today()}render();return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){A[a.dataset.act](a.dataset.id,a);return}
});
let qT;
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='wq'||el.id==='attQ'){clearTimeout(qT);qT=setTimeout(()=>{UI[el.id]=el.value;render()},200)}});
document.addEventListener('change',e=>{
  const el=e.target;if(el.closest('.sheet'))return;
  if(el.id==='bulkFile'){const fs=[...el.files];el.value='';bulkIDs(fs);return}
  if(el.id==='meterP'){UI.meterP=el.value;render()}
  else if(el.id==='attDate'){UI.attDate=el.value||today();render()}
  else if(el.id==='attMonth'){UI.attMonth=el.value||thisMonth();render()}
  else if(el.id==='attFP'){UI.attFP=el.value;render()}
  else if(el.id==='payMonth'){UI.payMonth=el.value||thisMonth();render()}
  else if(el.id==='mFilterP'){UI.mFilterP=el.value;render()}
  else if(el.id==='mFilterM'){UI.mFilterM=el.value;render()}
  else if(el.dataset.attp){setAtt(UI.attDate,el.dataset.attp,{proj:el.value})}
  else if(el.id==='rpP'){UI.rp=el.value;render()}
  else if(el.id==='rFrom'){UI.rfrom=el.value;render()}
  else if(el.id==='rTo'){UI.rto=el.value;render()}
  else if(el.dataset.mfield){if(el.value){UI[el.dataset.mfield]=el.value;render()}}});
$('#fab').onclick=()=>{const t=UI.tab;
  if(t==='projects'||(t==='home'&&!S.projects.length))A.addProject();
  else if(t==='projects'&&UI.pseg==='meters'){const i=document.querySelector('[data-qm]');i?(i.scrollIntoView({block:'center'}),i.focus()):A.goMeters()}
  else if(t==='workers')(UI.wseg==='adv'?A.addAdv:A.addWorker)();
  else if(t==='money')(UI.mseg==='pay'?A.addPayment:UI.mseg==='inv'?A.addInvoice:A.addExpense)();
  else quickAdd()};
function quickAdd(){openSheet(`<div class="spread"><h2>إضافة سريعة</h2><button class="iconbtn" data-close aria-label="إغلاق">✕</button></div>
  <div class="grid2">${[['goAtt','حضور اليوم'],['addMeter',allArea()?'أمتار اليوم':'إنتاج اليوم'],['addExpense','مصروف'],['addPayment','دفعة مستلمة'],['addAdv','سلفة عامل'],['addWorker','عامل'],['addProject','مشروع']].map(([k,l])=>`<button class="btn block" data-q="${k}">${l}</button>`).join('')}</div>`,sc=>{
  sc.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{closeSheet();A[b.dataset.q]()})})}
$('#btnSettings').onclick=settingsSheet;$('#btnLang').onclick=()=>setLang(isEN()?'ar':'en');$('#btnLock').onclick=lockNow;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.matches&&e.target.matches('[role=button][data-act]'))e.target.click()});
init();
})();
